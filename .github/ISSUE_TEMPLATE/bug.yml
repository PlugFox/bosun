name: Bug
description: Something bosun does differs from what an issue says it should do.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        This repository is public. Do not paste real transcripts, tokens, paths or text from
        private repositories; reduce the problem to a synthetic reproduction.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Observed behaviour, with the exact error text if short.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
      description: Name the issue and section that specifies it, if any.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps, with synthetic data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and platform
      placeholder: "commit or release; Windows 11 / macOS 15 / Ubuntu 24.04"
    validations:
      required: true
