# CI of #12. Actions are pinned by commit; the comment names the release.
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        shell: bash
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # cargo-nextest at the version of mise.toml, and only it: the other tools are the policy
      # job's (sqlx-cli would compile from source on Windows and macOS).
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
          install: true
          install_args: aqua:nextest-rs/nextest/cargo-nextest
          cache: true
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # E26 (#8): tests never depend on a git configuration of the machine. The runner's global
      # and system configuration are out; a test that commits names its own identity.
      - name: An empty global git configuration
        shell: bash
        run: ': > "$RUNNER_TEMP/empty.gitconfig"'
      # cargo-nextest (#234): the bosund scenes share the bounded group `scenes`, and the default
      # filter of `.config/nextest.toml` leaves out `tests/install.rs`, which registers a real
      # scheduled task. The setup script `build-helpers` needs `sh` on PATH (Git's on Windows).
      - name: Tests
        shell: bash
        run: cargo nextest run --workspace --all-targets --locked --no-fail-fast
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/empty.gitconfig
          GIT_CONFIG_NOSYSTEM: "1"
      - name: Doc tests
        run: cargo test --workspace --doc --locked
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/empty.gitconfig
          GIT_CONFIG_NOSYSTEM: "1"

  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
          install: true
          cache: true
      - name: Dependency rules
        run: cargo xtask check-deps
      - name: Fixtures are synthetic
        run: cargo xtask lint-fixtures
      - name: Licences, bans, advisories, sources
        run: cargo-deny check
      - name: Unused dependencies
        run: cargo-machete
      - name: Typos
        run: typos
      # Every other job builds with SQLX_OFFLINE=true from `.sqlx/` (#19); this one fails when a
      # query or a migration changed without `cargo xtask sqlx-prepare`.
      - name: The sqlx offline cache is current
        run: cargo xtask sqlx-prepare --check
      # The JSON Schema half of the contract job (#12, #24): a protocol type changed without
      # `cargo xtask gen-api` fails here.
      - name: The API schema is current
        run: cargo xtask gen-api --check

  # Mutants (#12, #15): platform-independent ones are sharded on Linux; a mutant bound to a
  # platform runs only there. `mutants` is the required check that gathers them.
  mutant-shards:
    name: mutants (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: shard 1/8, os: ubuntu-latest, args: --shard 1/8 }
          - { name: shard 2/8, os: ubuntu-latest, args: --shard 2/8 }
          - { name: shard 3/8, os: ubuntu-latest, args: --shard 3/8 }
          - { name: shard 4/8, os: ubuntu-latest, args: --shard 4/8 }
          - { name: shard 5/8, os: ubuntu-latest, args: --shard 5/8 }
          - { name: shard 6/8, os: ubuntu-latest, args: --shard 6/8 }
          - { name: shard 7/8, os: ubuntu-latest, args: --shard 7/8 }
          - { name: shard 8/8, os: ubuntu-latest, args: --shard 8/8 }
          - { name: windows, os: windows-latest, args: --platform-only }
          - { name: macos, os: macos-latest, args: --platform-only }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        shell: bash
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.name }}
      # E26 (#8): no global or system git configuration, as in the test job.
      - name: An empty global git configuration
        shell: bash
        run: ': > "$RUNNER_TEMP/empty.gitconfig"'
      - name: Every selected mutant goes red
        run: cargo xtask mutants ${{ matrix.args }}
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/empty.gitconfig
          GIT_CONFIG_NOSYSTEM: "1"

  mutants:
    name: mutants
    needs: mutant-shards
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: test "${{ needs.mutant-shards.result }}" = success
