[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Latest stable only (#1): equal to the toolchain in rust-toolchain.toml; bump both together.
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PlugFox/bosun"
# Nothing is published to crates.io (#1).
publish = false

[workspace.dependencies]
cargo_metadata = "0.23.1"
# The arguments of the `bosun` CLI (#25), by derive; no colour and no suggestions, so the
# dependency stays small.
clap = { version = "4.6.9", default-features = false, features = [
  "derive",
  "error-context",
  "help",
  "std",
  "usage",
] }
# The OS file id (inode, Windows file index) that keys a transcript file, so a rename is not a
# new file (#3, #21). Maintained with `notify`, which watching (#22) uses.
file-id = "0.2.3"
# The random agent credentials of bosund (#63): the OS's random source. Already in the graph
# through `tempfile`, so it adds nothing new to build.
getrandom = { version = "0.4.3", default-features = false }
# The Unix system calls of `bosun-proc` (#50): process groups, the parent-death signal, the
# start time of a process.
libc = "0.2.191"
# File watching (#22): latency only; the rescan stays the source of truth.
notify = "9.0.0"
# The CommonMark parser of the publication sanitiser (#8, #56): parse only, no HTML writer, no
# I/O; the allowlist re-emitter is ours.
pulldown-cmark = { version = "0.13.6", default-features = false }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# The terminal client (#73): widgets, layout and the crossterm backend; no default features, so
# only what the crossterm backend needs is built.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
regex = "1.13.1"
# The JSON Schema of the local API (#12, #24), generated from `bosun-api` by `cargo xtask gen-api`.
schemars = { version = "1.2.3", default-features = false, features = ["derive", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The snapshot hash of a queue item (#5, #51) and the configuration and policy hashes (#55).
# Already in the graph through `sqlx`, so it adds nothing new to build.
sha2 = "0.11.1"
# Parse only for now; the formatting-preserving writer (`config.set`, #4) needs `display` later.
toml_edit = { version = "0.25.19", default-features = false, features = ["parse"] }
# The store (#19): SQLite only, the bundled library, compile-time checked queries, embedded
# migrations. Offline: `.sqlx/` is committed and `SQLX_OFFLINE` is set in .cargo/config.toml.
sqlx = { version = "0.9.1", default-features = false, features = [
  "runtime-tokio",
  "sqlite-bundled",
  "macros",
  "migrate",
] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false }
# The Win32 calls of `bosun-proc` (#50): Job Objects, process times, power requests. Raw
# bindings only, generated by Microsoft from the Windows metadata.
windows-sys = "0.61.2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
