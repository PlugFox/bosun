[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Latest stable only (#1): equal to the toolchain in rust-toolchain.toml; bump both together.
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PlugFox/bosun"
# Nothing is published to crates.io (#1).
publish = false

[workspace.dependencies]
cargo_metadata = "0.23.1"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
regex = "1.13.1"
serde_json = "1.0.154"
# Parse only for now; the formatting-preserving writer (`config.set`, #4) needs `display` later.
toml_edit = { version = "0.25.19", default-features = false, features = ["parse"] }
# The store (#19): SQLite only, the bundled library, compile-time checked queries, embedded
# migrations. Offline: `.sqlx/` is committed and `SQLX_OFFLINE` is set in .cargo/config.toml.
sqlx = { version = "0.9.1", default-features = false, features = [
  "runtime-tokio",
  "sqlite-bundled",
  "macros",
  "migrate",
] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
# Mutants are cfg-only, never features, so --all-features cannot enable one (#12).
# Every mutant registered in xtask/src/mutants.rs is declared here.
unexpected_cfgs = { level = "warn", check-cfg = [
  "cfg(mutant_core_async_runtime)",
  "cfg(mutant_xtask_no_build_step)",
  "cfg(mutant_core_1h_as_5m)",
  "cfg(mutant_core_final_blocks_only)",
  "cfg(mutant_core_first_record_wins)",
  "cfg(mutant_core_no_threshold)",
  "cfg(mutant_core_case_sensitive)",
  "cfg(mutant_recount_last_block)",
  "cfg(mutant_recount_no_dedup)",
  "cfg(mutant_fixture_lint_off)",
  "cfg(mutant_config_shared_dir)",
  "cfg(mutant_config_skip_disk_probe)",
  "cfg(mutant_store_commit_per_row)",
  "cfg(mutant_store_accept_newer)",
  "cfg(mutant_store_default_perms)",
] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
