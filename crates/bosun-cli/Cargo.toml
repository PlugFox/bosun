[package]
name = "bosun-cli"
description = "The `bosun` command line: a client of the local API for token sums, ingest status and reingest."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "bosun"
path = "src/main.rs"

# A client (#12): bosun-client, bosun-api and bosun-config only; `cargo xtask check-deps`
# enforces it.
[dependencies]
bosun-api = { path = "../bosun-api" }
bosun-client = { path = "../bosun-client" }
bosun-config = { path = "../bosun-config" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }

# The tests start a real `bosund` and run `recount`; both are built by the tests themselves
# (`cargo build -p bosund -p recount`), never linked.
[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
