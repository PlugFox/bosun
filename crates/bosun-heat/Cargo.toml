[package]
name = "bosun-heat"
description = "Metrics and the report of bosun: the exact and the estimate sections of the stage-0 report over the store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bosun-api = { path = "../bosun-api" }
bosun-core = { path = "../bosun-core" }
bosun-store = { path = "../bosun-store" }

# The tests ingest the synthetic corpus into a real store and compare the report with a
# committed golden file.
[dev-dependencies]
bosun-ingest = { path = "../bosun-ingest" }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
