[package]
name = "bosun-ingest"
description = "Transcript discovery, tailing and provider parsers of bosun: transcript files to the store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bosun-config = { path = "../bosun-config" }
bosun-core = { path = "../bosun-core" }
bosun-store = { path = "../bosun-store" }
file-id.workspace = true
notify.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

# The commit reader's tests write synthetic session rows with sqlx directly (#23).
[dev-dependencies]
sqlx.workspace = true
tempfile.workspace = true
# The watch and backfill tests run the ingest task on several workers (#22).
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
