[package]
name = "bosun-ingest"
description = "Provider transcript parsers of bosun: transcript lines to the event model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Parsing only (#20): no async runtime, no database. Discovery and tailing are #21's.
[dependencies]
bosun-core = { path = "../bosun-core" }
serde_json.workspace = true

# The commit reader's tests store what it reads and query the link (#23); synthetic session
# rows are written with sqlx directly.
[dev-dependencies]
bosun-store = { path = "../bosun-store" }
sqlx.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
