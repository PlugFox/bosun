[package]
name = "bosun-mcp"
description = "The MCP server of bosun for agent sessions, a client of the local API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# A client (#12): bosun-client, bosun-api and bosun-config only; `cargo xtask check-deps`
# enforces it.
[dependencies]
bosun-api = { path = "../bosun-api" }
bosun-client = { path = "../bosun-client" }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "rt", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt", "time"] }

[lints]
workspace = true
