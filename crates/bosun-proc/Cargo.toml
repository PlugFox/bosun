[package]
name = "bosun-proc"
description = "Child processes of bosun: tracking, tree kill, reaping, the power request and the endpoint security descriptor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tokio = { workspace = true, features = ["process", "time"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
tokio = { workspace = true, features = ["net"] }
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Power",
  "Win32_System_Threading",
  # The local time zone of the daily cap (#67).
  "Win32_System_Time",
] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }

# The session shim (#8): runs one child in a container for the daemon, std only in its own code.
[[bin]]
name = "bosun-shim"
path = "src/bin/bosun-shim.rs"

# The child of the shim tests: a role per behaviour (#8), not a product.
[[bin]]
name = "bosun-proc-helper"
path = "src/bin/bosun-proc-helper.rs"

[lints]
workspace = true
