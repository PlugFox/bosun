[package]
name = "bosun-proc"
description = "Child processes of bosun: tracking, tree kill, reaping, the power request and the endpoint security descriptor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The session shim (#8, #129): std only, so `unsafe` stays in this crate.
[[bin]]
name = "bosun-shim"
path = "src/bin/bosun-shim.rs"

[dependencies]
tokio = { workspace = true, features = ["process", "time"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
tokio = { workspace = true, features = ["net"] }
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Power",
  "Win32_System_Threading",
  # The local time zone of the daily cap (#67).
  "Win32_System_Time",
] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }

[lints]
workspace = true
