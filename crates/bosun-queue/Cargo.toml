[package]
name = "bosun-queue"
description = "The work queue of bosun: the queue trait, the item contract and its backends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The local-file backend is on by default: it costs nothing beyond the TOML writer, and it is
# the backend of tests and of repositories with no board (#5). `bosund` may still disable
# default features and name it explicitly.
default = ["local_file", "projects_v2"]
local_file = ["toml_edit/display"]
# The GitHub Projects v2 backend (#60): GraphQL through `gh api graphql`, so only a JSON codec
# is added. On by default because `bosund` binds boards with it.
projects_v2 = ["dep:serde_json"]
# The backend-agnostic trait test suite, for other backends' tests (#60, #61).
testsuite = []

[dependencies]
# The hidden key marker of the daemon's comments (`bosun_core::publish`, #56): one format for
# every backend and for the prompt builder.
bosun-core = { path = "../bosun-core" }
serde_json = { workspace = true, optional = true }
sha2.workspace = true
toml_edit.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
