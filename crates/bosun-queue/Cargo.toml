[package]
name = "bosun-queue"
description = "The work queue of bosun: the queue trait, the item contract and its backends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The local-file backend is on by default: it costs nothing beyond the TOML writer, and it is
# the backend of tests and of repositories with no board (#5). `bosund` may still disable
# default features and name it explicitly.
default = ["local_file"]
local_file = ["toml_edit/display"]
# The backend-agnostic trait test suite, for other backends' tests (#60, #61).
testsuite = []

[dependencies]
sha2.workspace = true
toml_edit.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
