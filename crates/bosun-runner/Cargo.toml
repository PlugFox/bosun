[package]
name = "bosun-runner"
description = "Coding-agent runners of bosun: the runner trait, the verdict executor and the provider runners."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["claude"]
# The Claude Code runner (#52).
claude = ["dep:serde_json"]

[dependencies]
bosun-proc = { path = "../bosun-proc" }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["io-util", "macros", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true
