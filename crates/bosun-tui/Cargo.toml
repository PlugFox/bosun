[package]
name = "bosun-tui"
description = "The terminal client of bosun (ratatui), exposed as bosun tui."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# A client (#12): bosun-client and bosun-api only; `cargo xtask check-deps` enforces it.
[dependencies]
bosun-api = { path = "../bosun-api" }
bosun-client = { path = "../bosun-client" }
ratatui.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

# The tests serve a fake daemon on a real pipe (Windows) or socket (Unix).
[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[lints]
workspace = true
