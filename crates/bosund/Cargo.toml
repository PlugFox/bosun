[package]
name = "bosund"
description = "The bosun daemon: one store and one ingest per identity, served on the local endpoint."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bosun-api = { path = "../bosun-api" }
bosun-client = { path = "../bosun-client" }
bosun-config = { path = "../bosun-config" }
bosun-core = { path = "../bosun-core" }
bosun-heat = { path = "../bosun-heat" }
bosun-ingest = { path = "../bosun-ingest" }
bosun-store = { path = "../bosun-store" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }

# The owner-only security descriptor of the named pipe (#71).
[target.'cfg(windows)'.dependencies]
bosun-proc = { path = "../bosun-proc" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
