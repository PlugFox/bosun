[package]
name = "bosund"
description = "The bosun daemon: one store and one ingest per identity, served on the local endpoint."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bosun-api = { path = "../bosun-api" }
bosun-client = { path = "../bosun-client" }
bosun-config = { path = "../bosun-config" }
bosun-core = { path = "../bosun-core" }
bosun-git = { path = "../bosun-git" }
bosun-heat = { path = "../bosun-heat" }
bosun-identity = { path = "../bosun-identity" }
bosun-ingest = { path = "../bosun-ingest" }
# Spawning into a container, the power request (#50), and the pipe's security descriptor (#71).
bosun-proc = { path = "../bosun-proc" }
bosun-queue = { path = "../bosun-queue" }
bosun-runner = { path = "../bosun-runner" }
bosun-store = { path = "../bosun-store" }
# The agent credentials (#63).
getrandom.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The temporary index that sets an item's uncommitted work aside (#62).
tempfile.workspace = true
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }

[lints]
workspace = true
