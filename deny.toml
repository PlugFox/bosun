# Licence and ban policy for Rust dependencies (#12). Checked in CI by `cargo deny check`.

[graph]
# Every platform bosun ships on, so a platform-only dependency is checked too.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
ignore = []

[licenses]
# Permissive licences compatible with MIT OR Apache-2.0. Add one only with a reason.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The list is policy, not inventory: an allowed licence nobody uses yet is fine.
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are `publish = false`; their licence is the workspace's.
ignore = true

[bans]
multiple-versions = "warn"
# A version wildcard (`*`) is refused; path dependencies inside the workspace are fine.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
